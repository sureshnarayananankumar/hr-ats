# =====================================================================
#  nginx configuration for the production frontend image.
#  Serves the built SPA only -- API traffic goes to Kong, not here.
# =====================================================================

server {
    # 8080 rather than 80 so nginx can run as a non-root user.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    # Kong sets gateway-level headers; these cover what only the origin
    # serving the HTML can meaningfully declare.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # The SPA loads its own bundles and talks to Kong. 'unsafe-inline'
    # for styles is required by the CSS-in-JS used by the UI primitives;
    # scripts stay restricted to self.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8000 https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or users get a stale shell that
    # references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Client-side routing: unknown paths fall through to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container health check target.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
    }
}
